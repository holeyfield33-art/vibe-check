[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-check"
version = "1.1.3"
description = "Zero-dependency offline repo triage for review signals (syntax, supply chain, duplicates, dead code). One file, Python stdlib only."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Ashura Joseph Holeyfield"}]
keywords = ["static-analysis", "code-quality", "vibe-coding", "zero-dependency"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/holeyfield33-art/vibe-check"
Repository = "https://github.com/holeyfield33-art/vibe-check"
Issues = "https://github.com/holeyfield33-art/vibe-check/issues"

[project.scripts]
vibe-check = "vibe_check:main"

[tool.setuptools]
py-modules = ["vibe_check"]
