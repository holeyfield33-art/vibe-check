name: vibe-check

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads code and uploads an artifact. Never grant the
# default read-write token to CI that runs on pull requests.
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Actions are pinned to full commit SHAs so a repointed release tag
        # can never inject code into this pipeline. Dependabot keeps the pins
        # current (.github/dependabot.yml).
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Run tests
        run: python -W error::ResourceWarning test_vibe_check.py

      - name: Run vibe-check (gate on hard signals)
        run: python vibe_check.py . --out report.json --html report.html --fail-on hard

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibe-check-report
          path: |
            report.json
            report.html
